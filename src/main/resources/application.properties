# Local secrets; online the same keys come from environment variables
spring.config.import=optional:file:env.properties
spring.application.name=recipebook
server.port=${PORT:8080}

# Online: full JDBC URL in DATABASE_URL (e.g. jdbc:postgresql://host/db?sslmode=require)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/${PG_DB_NAME}}
spring.datasource.username=${PG_USERNAME}
spring.datasource.password=${PG_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Loads categories/tags of a whole page in a few queries instead of one per recipe
spring.jpa.properties.hibernate.default_batch_fetch_size=20
# Runs schema.sql (enables the unaccent extension) at every startup
spring.sql.init.mode=always

spring.data.web.pageable.max-page-size=50
# Pages are serialized as { content, page: { size, number, totalElements, totalPages } }
spring.data.web.pageable.serialization-mode=via-dto

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION}

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

# Comma-separated; online add the frontend URL via CORS_ALLOWED_ORIGINS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.forward-headers-strategy=framework
